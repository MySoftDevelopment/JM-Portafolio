# Cada push a main construye el sitio y publica dist/ en la rama deploy.
# Hostinger recibe el webhook de GitHub y hace pull de deploy en la carpeta web/.
name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: deploy
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  check-latest: true
                  cache: yarn

            - run: yarn install --frozen-lockfile

            - run: yarn build

            # Sin force_orphan: la rama conserva su historial y Hostinger puede hacer pull normal.
            - uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_branch: deploy
                  publish_dir: ./dist
                  user_name: github-actions[bot]
                  user_email: 41898299+github-actions[bot]@users.noreply.github.com
                  commit_message: 'Deploy'
